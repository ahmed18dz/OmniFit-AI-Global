<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniFit AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2"></script>
</head>
<body>

<header>
    <div class="logo">OmniFit AI</div>
    <div id="status">READY</div>
</header>

<div class="container">
    <div id="home-page" class="page active-page">
        <div id="vision-box">
            <video id="video" playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        <button class="btn-start" onclick="startCamera()">START AI</button>
    </div>

    <div id="coach-page" class="page">
        <h2>Coach Dashboard</h2>
        <div class="card"><p>Revenue: $0.00</p></div>
    </div>
</div>

<nav>
    <i class="fas fa-home active" onclick="navTo('home-page', this)"></i>
    <i class="fas fa-dumbbell" onclick="navTo('coach-page', this)"></i>
</nav>

<script src="script.js"></script>
</body>
</html>
